# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sasfc
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL55Dialect

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Storage Properties
file.upload-dir=./uploads

# JWT Configuration
# Use a long, random string here for production (e.g., from a password generator)
jwt.secret=your-super-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.expiration.ms=120000

# Max size of a single file (e.g., 10 Megabytes)
spring.servlet.multipart.max-file-size=10MB

# Max size of the total request (all files + fields) (e.g., 30 Megabytes)
spring.servlet.multipart.max-request-size=30MB
